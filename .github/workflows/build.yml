name: BananaClient Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Extract ZIP
        run: unzip 'BananaClient-1.21.4-Articraft.zip' -d source

      - name: Build JAR
        run: |
          cd source/BananaClient-1.21.4
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: BananaClient-JAR
          path: source/BananaClient-1.21.4/build/libs/*.jar
