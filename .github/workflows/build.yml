
name: BananaClient Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: unzip -q BananaClient-1.21.4-Articraft.zip

      - name: Fix build.gradle in temporary copy
        run: |
          sed -i 's/rename "${it}_${project.archivesBaseName}"/rename { "${it}_${project.archivesBaseName}" }/' BananaClient-1.21.4/build.gradle
          sed -i "s/1.5-SNAPSHOT/1.9.2/" BananaClient-1.21.4/build.gradle

      - name: Build JAR
        run: |
          cd BananaClient-1.21.4
          gradle wrapper --gradle-version 8.11
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BananaClient-JAR
          path: BananaClient-1.21.4/build/libs/*.jar
          if-no-files-found: error
          
